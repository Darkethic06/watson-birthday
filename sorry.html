<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I'm Sorry 🥺</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #2b1f4a 0%, #120c24 60%, #07050f 100%);
            color: #fff;
        }

        #scene {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .message {
            position: fixed;
            left: 50%;
            bottom: 6vh;
            transform: translateX(-50%);
            width: min(92vw, 640px);
            text-align: center;
            padding: 22px 26px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            opacity: 0;
            animation: rise 1.4s ease-out 0.6s forwards;
            z-index: 2;
        }

        .message h1 {
            font-family: 'Pacifico', cursive;
            font-weight: 400;
            font-size: clamp(1.6rem, 5vw, 2.6rem);
            color: #ffb3c7;
            text-shadow: 0 0 18px rgba(255, 120, 160, 0.6);
            margin-bottom: 8px;
        }

        .message p {
            font-size: clamp(1rem, 2.8vw, 1.25rem);
            line-height: 1.6;
            color: #f3e9ff;
        }

        .message p.plea {
            margin-top: 6px;
            font-weight: 600;
            color: #ffd6e2;
        }

        .buttons {
            margin-top: 18px;
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .buttons button {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 999px;
            padding: 11px 26px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff6f91, #ff9671);
            color: #fff;
            box-shadow: 0 6px 20px rgba(255, 111, 145, 0.5);
        }

        #yesBtn:hover { transform: scale(1.08); }

        #noBtn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            position: relative;
            transition: left 0.25s ease, top 0.25s ease;
        }

        .forgiven {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 3;
        }

        .forgiven.show { opacity: 1; }

        .forgiven h2 {
            font-family: 'Pacifico', cursive;
            font-weight: 400;
            font-size: clamp(2rem, 7vw, 4rem);
            color: #ffb3c7;
            text-shadow: 0 0 24px rgba(255, 120, 160, 0.8);
            margin-top: -30vh;
        }

        .heart {
            position: fixed;
            top: -40px;
            font-size: 24px;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes rise {
            from { opacity: 0; transform: translate(-50%, 30px); }
            to   { opacity: 1; transform: translate(-50%, 0); }
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>

<body>

    <canvas id="scene"></canvas>

    <div class="message" id="message">
        <h1>I'm Sorry 🥺</h1>
        <p>Arijit wants to say sorry to you for his behaviour.</p>
        <p class="plea">Please forgive him 💗</p>

        <div class="buttons">
            <button id="yesBtn">I forgive you 💖</button>
            <button id="noBtn">No 😤</button>
        </div>
    </div>

    <div class="forgiven" id="forgiven">
        <h2>Thank you! 💞</h2>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // ---------- Scene setup ----------
        const canvas = document.getElementById('scene');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0.3, 11);

        scene.add(new THREE.HemisphereLight(0xffe6f0, 0x2a1a4a, 0.9));

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
        keyLight.position.set(3, 6, 5);
        keyLight.castShadow = true;
        scene.add(keyLight);

        const rimLight = new THREE.PointLight(0xff6f91, 25, 20);
        rimLight.position.set(-3, 2, -2);
        scene.add(rimLight);

        // ---------- Materials ----------
        const bodyMat   = new THREE.MeshStandardMaterial({ color: 0xe8ecf5, metalness: 0.35, roughness: 0.3 });
        const darkMat   = new THREE.MeshStandardMaterial({ color: 0x1c1b2e, metalness: 0.2, roughness: 0.5 });
        const accentMat = new THREE.MeshStandardMaterial({ color: 0xff6f91, metalness: 0.3, roughness: 0.35 });
        const eyeMat    = new THREE.MeshBasicMaterial({ color: 0x7fe7ff });
        const blushMat  = new THREE.MeshBasicMaterial({ color: 0xff8fb1, transparent: true, opacity: 0.7 });
        const tearMat   = new THREE.MeshStandardMaterial({ color: 0x8fd8ff, metalness: 0.1, roughness: 0.05, transparent: true, opacity: 0.85 });

        // ---------- Robot ----------
        const robot = new THREE.Group();
        scene.add(robot);

        // Body
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.85, 0.9, 8, 24), bodyMat);
        body.position.y = 0;
        body.castShadow = true;
        robot.add(body);

        // Chest heart panel
        const heartShape = new THREE.Shape();
        heartShape.moveTo(0, -0.25);
        heartShape.bezierCurveTo(-0.45, 0.05, -0.25, 0.4, 0, 0.18);
        heartShape.bezierCurveTo(0.25, 0.4, 0.45, 0.05, 0, -0.25);
        const chestHeart = new THREE.Mesh(
            new THREE.ExtrudeGeometry(heartShape, { depth: 0.08, bevelEnabled: true, bevelSize: 0.03, bevelThickness: 0.03, bevelSegments: 4 }),
            accentMat
        );
        chestHeart.position.set(0, 0.05, 0.82);
        robot.add(chestHeart);

        // Head (tilts sadly)
        const headGroup = new THREE.Group();
        headGroup.position.y = 1.55;
        robot.add(headGroup);

        const head = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.25, 1.3, 4, 4, 4), bodyMat);
        roundBox(head.geometry, 0.28);
        head.castShadow = true;
        headGroup.add(head);

        const face = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.9, 0.05), darkMat);
        face.position.z = 0.66;
        headGroup.add(face);

        // Sad eyes: glowing arcs drooping at the outer corners
        const eyes = [];
        [-0.33, 0.33].forEach((x, i) => {
            const eye = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.04, 12, 24, Math.PI), eyeMat);
            eye.position.set(x, 0.1, 0.7);
            eye.rotation.z = i === 0 ? -0.25 : 0.25; // droopy tilt
            headGroup.add(eye);
            eyes.push(eye);
        });

        // Sad mouth (upside-down arc)
        const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.03, 12, 24, Math.PI), eyeMat);
        mouth.position.set(0, -0.25, 0.7);
        headGroup.add(mouth);

        // Blush
        [-0.55, 0.55].forEach(x => {
            const blush = new THREE.Mesh(new THREE.CircleGeometry(0.1, 20), blushMat);
            blush.position.set(x, -0.1, 0.695);
            headGroup.add(blush);
        });

        // Antenna
        const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.5), darkMat);
        antenna.position.y = 0.85;
        headGroup.add(antenna);
        const bulbMat = accentMat.clone();
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.12, 20, 20), bulbMat);
        bulb.position.y = 1.12;
        headGroup.add(bulb);
        const bulbLight = new THREE.PointLight(0xff6f91, 3, 3);
        bulbLight.position.copy(bulb.position);
        headGroup.add(bulbLight);

        // Ears
        [-0.9, 0.9].forEach(x => {
            const ear = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.15, 20), accentMat);
            ear.rotation.z = Math.PI / 2;
            ear.position.x = x;
            headGroup.add(ear);
        });

        // Tear drop (falls from the left eye on a loop)
        const tear = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), tearMat);
        tear.scale.y = 1.4;
        headGroup.add(tear);

        // Arms: both hold a heart out in front, like an offering
        const arms = [];
        [-1, 1].forEach(side => {
            const shoulder = new THREE.Group();
            shoulder.position.set(side * 0.95, 0.45, 0);
            robot.add(shoulder);

            const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.7, 6, 16), bodyMat);
            arm.position.y = -0.45;
            arm.castShadow = true;
            shoulder.add(arm);

            const hand = new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 20), accentMat);
            hand.position.y = -0.92;
            shoulder.add(hand);

            shoulder.rotation.x = -1.1;
            shoulder.rotation.z = side * 0.35;
            arms.push(shoulder);
        });

        // Offered heart
        const giftHeart = new THREE.Mesh(
            new THREE.ExtrudeGeometry(heartShape, { depth: 0.2, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.06, bevelSegments: 6 }),
            new THREE.MeshStandardMaterial({ color: 0xff3b6b, emissive: 0xff1f55, emissiveIntensity: 0.35, metalness: 0.2, roughness: 0.3 })
        );
        giftHeart.scale.setScalar(1.3);
        giftHeart.position.set(0, -0.15, 1.35);
        robot.add(giftHeart);

        // Legs
        [-0.4, 0.4].forEach(x => {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.6, 16), darkMat);
            leg.position.set(x, -1.5, 0);
            robot.add(leg);
            const foot = new THREE.Mesh(new THREE.SphereGeometry(0.3, 20, 20, 0, Math.PI * 2, 0, Math.PI / 2), bodyMat);
            foot.position.set(x, -1.8, 0.08);
            foot.scale.z = 1.4;
            robot.add(foot);
        });

        robot.position.y = 0.6;

        // Floor shadow
        const floor = new THREE.Mesh(
            new THREE.CircleGeometry(2.2, 48),
            new THREE.ShadowMaterial({ opacity: 0.35 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.22;
        floor.receiveShadow = true;
        scene.add(floor);

        // Sparkles
        const sparkleGeo = new THREE.BufferGeometry();
        const sparkleCount = 300;
        const positions = new Float32Array(sparkleCount * 3);
        for (let i = 0; i < sparkleCount; i++) {
            positions[i * 3]     = (Math.random() - 0.5) * 30;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
            positions[i * 3 + 2] = -Math.random() * 15 - 2;
        }
        sparkleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const sparkles = new THREE.Points(sparkleGeo, new THREE.PointsMaterial({ color: 0xffc4d6, size: 0.06 }));
        scene.add(sparkles);

        // ---------- Helpers ----------
        // Pushes box vertices outward toward a rounded shape
        function roundBox(geometry, radius) {
            const pos = geometry.attributes.position;
            const v = new THREE.Vector3();
            geometry.computeBoundingBox();
            const half = new THREE.Vector3();
            geometry.boundingBox.getSize(half).multiplyScalar(0.5);
            const inner = half.clone().subScalar(radius);
            for (let i = 0; i < pos.count; i++) {
                v.fromBufferAttribute(pos, i);
                const clamped = new THREE.Vector3(
                    THREE.MathUtils.clamp(v.x, -inner.x, inner.x),
                    THREE.MathUtils.clamp(v.y, -inner.y, inner.y),
                    THREE.MathUtils.clamp(v.z, -inner.z, inner.z)
                );
                const dir = v.clone().sub(clamped);
                if (dir.lengthSq() > 0) {
                    dir.normalize().multiplyScalar(radius);
                    v.copy(clamped.add(dir));
                }
                pos.setXYZ(i, v.x, v.y, v.z);
            }
            geometry.computeVertexNormals();
        }

        // ---------- Interaction ----------
        const mouse = new THREE.Vector2();
        window.addEventListener('pointermove', e => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
        });

        let happy = false;

        const noBtn = document.getElementById('noBtn');
        const dodge = () => {
            const x = (Math.random() - 0.5) * 220;
            const y = (Math.random() - 0.5) * 80;
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        };
        noBtn.addEventListener('pointerenter', dodge);
        noBtn.addEventListener('click', e => { e.preventDefault(); dodge(); });

        document.getElementById('yesBtn').addEventListener('click', () => {
            if (happy) return;
            happy = true;

            // Flip the face to a smile
            eyes.forEach(eye => { eye.rotation.z = Math.PI; });
            mouth.rotation.z = Math.PI;
            mouth.position.y = -0.18;
            tear.visible = false;

            document.getElementById('message').style.display = 'none';
            document.getElementById('forgiven').classList.add('show');

            setInterval(spawnHeart, 180);
        });

        function spawnHeart() {
            const h = document.createElement('div');
            h.className = 'heart';
            h.textContent = ['💖', '💕', '💗', '💞', '❤️'][Math.floor(Math.random() * 5)];
            h.style.left = `${Math.random() * 100}vw`;
            h.style.fontSize = `${16 + Math.random() * 22}px`;
            h.style.animationDuration = `${3 + Math.random() * 3}s`;
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 6500);
        }

        // ---------- Layout ----------
        function fitCamera() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;
            // Pull back on narrow screens so the robot stays in view above the message card
            camera.position.z = aspect < 0.8 ? 16 : 11;
            camera.position.y = aspect < 0.8 ? -0.6 : 0.3;
            camera.lookAt(0, camera.position.y, 0);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', fitCamera);
        fitCamera();

        // ---------- Animation loop ----------
        const clock = new THREE.Clock();

        function animate() {
            const t = clock.getElapsedTime();

            if (happy) {
                // Joyful bounce and spin
                robot.position.y = 0.6 + Math.abs(Math.sin(t * 5)) * 0.5;
                robot.rotation.y += 0.03;
                headGroup.rotation.z = Math.sin(t * 6) * 0.15;
                headGroup.rotation.x = 0;
                arms.forEach((arm, i) => {
                    arm.rotation.x = -2.6 + Math.sin(t * 8 + i * Math.PI) * 0.4;
                });
                giftHeart.position.y = 1.2 + Math.sin(t * 4) * 0.2;
                giftHeart.rotation.y += 0.06;
            } else {
                // Sad, shy sway — follows the pointer a little
                robot.position.y = 0.6 + Math.sin(t * 1.6) * 0.06;
                robot.rotation.y = THREE.MathUtils.lerp(robot.rotation.y, mouse.x * 0.4, 0.05);
                headGroup.rotation.x = 0.22 + Math.sin(t * 1.2) * 0.04; // head hung low
                headGroup.rotation.z = Math.sin(t * 0.8) * 0.1;
                arms.forEach((arm, i) => {
                    arm.rotation.x = -1.1 + Math.sin(t * 1.6 + i) * 0.04;
                });
                giftHeart.position.y = -0.15 + Math.sin(t * 2) * 0.05;
                giftHeart.rotation.y = Math.sin(t * 1.5) * 0.3;

                // Heartbeat pulse
                const beat = 1.3 + Math.max(0, Math.sin(t * 6)) * 0.08;
                giftHeart.scale.setScalar(beat);

                // Tear falling from left eye
                const tp = (t % 2.2) / 2.2;
                tear.visible = true;
                tear.position.set(-0.45, 0.0 - tp * 0.9, 0.72);
                tear.material.opacity = 0.85 * (1 - tp);

                // Blink
                const blink = (t % 4) < 0.12 ? 0.1 : 1;
                eyes.forEach(eye => { eye.scale.y = blink; });
            }

            bulbMat.emissive.setHex(0xff6f91).multiplyScalar(0.5 + Math.sin(t * 3) * 0.5);
            sparkles.rotation.y = t * 0.02;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();
    </script>

</body>
</html>
