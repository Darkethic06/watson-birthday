<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Floating Hearts Animation */
        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 30px;
            animation: float 15s infinite;
            opacity: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Page Container */
        .page {
            display: none;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Landing Page */
        .landing-page {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            margin: 0 auto;
        }

        .landing-page h1 {
            font-size: 48px;
            color: #e91e63;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .landing-page p {
            font-size: 20px;
            color: #555;
            margin-bottom: 30px;
        }

        .password-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 18px;
            border: 2px solid #e91e63;
            border-radius: 50px;
            outline: none;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .password-input:focus {
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.4);
            transform: scale(1.02);
        }

        .btn {
            background: linear-gradient(135deg, #e91e63, #f06292);
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.6);
        }

        .error {
            color: #d32f2f;
            margin-top: 10px;
            font-size: 16px;
        }

        /* Gallery Page */
        .gallery-page {
            text-align: center;
        }

        .gallery-page h1 {
            font-size: 48px;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        .gallery-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .photo-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
            background: #f0f0f0;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
        }

        .photo-item:hover {
            transform: scale(1.05);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-placeholder {
            font-style: italic;
            padding: 20px;
            text-align: center;
        }

        /* Quiz Page */
        .quiz-page {
            text-align: center;
        }

        .quiz-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            margin: 0 auto;
        }

        .quiz-container h1 {
            font-size: 42px;
            color: #e91e63;
            margin-bottom: 40px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }

        .quiz-btn {
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: white;
            padding: 20px 40px;
            font-size: 24px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
        }

        .quiz-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 25px rgba(233, 30, 99, 0.6);
        }

        /* Final Page */
        .final-page {
            text-align: center;
        }

        .final-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .final-container h1 {
            font-size: 48px;
            color: #e91e63;
            margin-bottom: 30px;
        }

        .rose-container {
            margin: 30px 0;
            font-size: 120px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .final-message {
            font-size: 32px;
            color: #555;
            margin: 30px 0;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .landing-page h1 {
                font-size: 36px;
            }

            .gallery-page h1 {
                font-size: 36px;
            }

            .quiz-container h1 {
                font-size: 32px;
            }

            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>

<body>
    <!-- Floating Hearts Background -->
    <div class="hearts" id="hearts"></div>

    <!-- Landing Page with Password -->
    <div class="page active" id="landingPage">
        <div class="landing-page">
            <h1>💕 Happy Valentine's Day 💕</h1>
            <p>Enter the secret password to continue...</p>
            <input type="password" class="password-input" id="passwordInput" placeholder="Enter password..."
                autocomplete="off">
            <button class="btn" onclick="checkPassword()">Enter</button>
            <p class="error" id="errorMsg"></p>
        </div>
    </div>

    <!-- Gallery Page -->
    <div class="page" id="galleryPage">
        <h1>💖 Our Beautiful Memories 💖</h1>
        <div class="gallery-container">
            <div class="photo-grid" id="photoGrid">
                <!-- Photo placeholders - replace with your actual images -->
                <div class="photo-item">
                    <div class="photo-placeholder">
                        <img src="images/1.jpeg" alt="" srcset="">
                    </div>
                </div>
                <div class="photo-item">
                    <div class="photo-placeholder"><img src="images/2.jpg" alt="" srcset=""></div>
                </div>
                <div class="photo-item">
                    <div class="photo-placeholder"><img src="images/3.jpg" alt="" srcset=""></div>
                </div>
                <div class="photo-item">
                    <div class="photo-placeholder"><img src="images/4.jpg" alt="" srcset=""></div>
                </div>
                <div class="photo-item">
                    <div class="photo-placeholder"><img src="images/5.jpg" alt="" srcset=""></div>
                </div>
                <div class="photo-item">
                    <div class="photo-placeholder"><img src="images/6.jpg" alt="" srcset=""></div>
                </div>
                <div class="photo-item">
                    <div class="photo-placeholder"><img src="images/7.jpg" alt="" srcset=""></div>
                </div>
                <div class="photo-item">
                    <div class="photo-placeholder"><img src="images/8.jpg" alt="" srcset=""></div>
                </div>
            </div>
            <button class="btn" onclick="showQuiz()">💝 Take the Quiz 💝</button>
        </div>
    </div>

    <!-- Quiz Page -->
    <div class="page" id="quizPage">
        <div class="quiz-container">
            <h1>💗 The Most Important Question 💗</h1>
            <p style="font-size: 32px; color: #555; margin-top: 30px;">
                Will You Be My Valentine?
            </p>
            <div class="quiz-options">
                <button class="quiz-btn" onclick="showFinal()">Yes 💕</button>
                <button class="quiz-btn" onclick="showFinal()">Obviously! 💖</button>
            </div>
        </div>
    </div>

    <!-- Final Page -->
    <div class="page" id="finalPage">
        <div class="final-container">
            <h1>🎉 Yay! You Said Yes! 🎉</h1>
            <div class="rose-container">🌹</div>
            <p class="final-message">4 Years Together<br>Many More to Go! 💕</p>

            <div class="photo-grid" style="margin-top: 40px;">
                <!-- Final celebration photos -->
                <div class="photo-item">
                    <div class="photo-placeholder">
                        <img src="images/2.jpg" alt="" srcset="">
                    </div>
                </div>
                <div class="photo-item">
                    <div class="photo-placeholder">
                        <img src="images/3.jpg" alt="" srcset="">
                    </div>
                </div>
                <div class="photo-item">
                    <div class="photo-placeholder"><img src="images/4.jpg" alt="" srcset=""></div>
                </div>
                <div class="photo-item">
                    <div class="photo-placeholder"><img src="images/5.jpg" alt="" srcset=""></div>
                </div>
                <div class="photo-item">
                    <div class="photo-placeholder"><img src="images/6.jpg" alt="" srcset=""></div>
                </div>
                <div class="photo-item">
                    <div class="photo-placeholder">
                        <img src="images/7.jpg" alt="" srcset="">
                    </div>
                </div>
            </div>

            <p style="margin-top: 40px; font-size: 24px; color: #e91e63;">
                I Love You! ❤️
            </p>
        </div>
    </div>

    <script>
        // Create floating hearts
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            const heartSymbols = ['❤️', '💕', '💖', '💗', '💝', '💘'];

            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 15 + 's';
                heart.style.animationDuration = (Math.random() * 10 + 10) + 's';
                heartsContainer.appendChild(heart);
            }
        }

        createHearts();

        // Password check
        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (password.toLowerCase() === 'iloveyou') {
                showPage('galleryPage');
                errorMsg.textContent = '';
            } else {
                errorMsg.textContent = 'Oops! Wrong password. Try again! 💕';
                document.getElementById('passwordInput').value = '';
            }
        }

        // Allow Enter key to submit password
        document.getElementById('passwordInput').addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                checkPassword();
            }
        });

        // Show quiz page
        function showQuiz() {
            showPage('quizPage');
        }

        // Show final page
        function showFinal() {
            showPage('finalPage');
        }

        // Page navigation
        function showPage(pageId) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }
    </script>
</body>

</html>
